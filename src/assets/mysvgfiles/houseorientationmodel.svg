<svg width="160" height="140" viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg">
  <!-- House block -->
  <rect x="40" y="60" width="80" height="50" fill="#EBD9C7" stroke="#8A6D55" stroke-width="3"/>
  <!-- Roof -->
  <polygon points="40,60 80,25 120,60" fill="#C9A27D" stroke="#8A6D55" stroke-width="3"/>
  <!-- Orientation arrow -->
  <line x1="80" y1="10" x2="80" y2="25" stroke="#444" stroke-width="4" stroke-linecap="round"/>
  <polygon points="80,0 70,15 90,15" fill="#444"/>
</svg>
